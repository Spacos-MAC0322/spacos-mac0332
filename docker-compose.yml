services:
  mongodb:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: python:3.12-slim
    working_dir: /workspace/server
    volumes:
      - ./server:/workspace/server
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: spacos
      JWT_SECRET: dev-jwt-secret-key-with-at-least-32-chars-spacos
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir -e '.[test,lint]' &&
      python -m app.scripts.init_db &&
      python -m app.jobs.sync_places --input tests/fixtures/mapas_culturais/spaces_sample.json --source-url https://saas.mapas.cultura.gov.br &&
      python -m app.scripts.publish_dev_places &&
      python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - server
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  mongodb_data:
  web_node_modules:
